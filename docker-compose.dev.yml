services:
  hermes-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: hermes-dev
    ports:
      - "18789:18789"
      - "5000:5000"
    volumes:
      - ./hermes-webui:/app/hermes-webui
      - ./hermes-agent:/app/hermes-agent
    environment:
      HERMES_WEBUI_PORT: "18789"
      HERMES_AGENT_PORT: "5000"
      # 按需覆盖：
      # HERMES_WEBUI_DEV_CMD: npm run dev -- --host 0.0.0.0 --port 18789
      # HERMES_AGENT_DEV_CMD: flask --app app run --host 0.0.0.0 --port 5000 --debug
    restart: unless-stopped
